<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 572" width="980" height="572" role="img" aria-label="better-hex throughput comparison vs const-hex, faster-hex, base16ct, and hex on x86_64 AVX-512 and AArch64 NEON">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --subtle: #64748b;
      --grid: #e2e8f0;
      --better: #2563eb;
      --const: #64748b;
      --faster: #94a3b8;
      --base16ct: #0d9488;
      --hex: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --subtle: #8b949e;
        --grid: #21262d;
        --better: #3b82f6;
        --const: #8b949e;
        --faster: #6e7681;
        --base16ct: #14b8a6;
        --hex: #484f58;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: var(--text); }
    .subtitle { font-size: 12px; fill: var(--muted); }
    .arch-title { font-size: 14px; font-weight: 700; fill: var(--text); }
    .arch-sub { font-size: 11px; fill: var(--muted); }
    .panel-title { font-size: 12px; font-weight: 600; fill: var(--text); }
    .label { font-size: 11.5px; fill: var(--text); }
    .label-bold { font-size: 11.5px; font-weight: 700; fill: var(--text); }
    .val { font-size: 11px; font-weight: 600; fill: var(--text); }
    .val-muted { font-size: 11px; fill: var(--muted); }
    .legend { font-size: 11px; fill: var(--muted); }
    .foot { font-size: 10.5px; fill: var(--subtle); }
  </style>

  <!-- Background -->
  <rect width="980" height="572" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>

  <!-- Header -->
  <text x="24" y="32" class="title">Throughput Comparison (16 KiB input, GiB/s — higher is better)</text>
  <text x="24" y="50" class="subtitle">Zero-allocation slice APIs (encode_to_slice / decode_to_slice / check); hex measured via allocating encode/decode. Decode &amp; check measured in hex input bytes.</text>

  <!-- Legend -->
  <g transform="translate(24, 66)">
    <rect x="0" y="0" width="11" height="11" rx="2" fill="var(--better)"/>
    <text x="16" y="9.5" class="legend">better-hex (constant-time SIMD)</text>
    <rect x="200" y="0" width="11" height="11" rx="2" fill="var(--base16ct)"/>
    <text x="216" y="9.5" class="legend">base16ct (constant-time scalar)</text>
    <rect x="398" y="0" width="11" height="11" rx="2" fill="var(--const)"/>
    <text x="414" y="9.5" class="legend">const-hex (SIMD, non-CT)</text>
    <rect x="572" y="0" width="11" height="11" rx="2" fill="var(--faster)"/>
    <text x="588" y="9.5" class="legend">faster-hex (non-CT)</text>
    <rect x="714" y="0" width="11" height="11" rx="2" fill="var(--hex)"/>
    <text x="730" y="9.5" class="legend">hex (scalar, non-CT)</text>
  </g>

  <!-- ==================== LEFT COLUMN: x86_64 AVX-512 ==================== -->
  <rect x="20" y="92" width="462" height="426" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="36" y="116" class="arch-title">x86_64 — AMD EPYC 9B45 (Zen 5)</text>
  <text x="36" y="132" class="arch-sub">AVX-512BW + VBMI · rustc 1.99.0 · 50 samples</text>

  <!-- x86 Encode (scale: 120 GiB/s = 280 px => 2.333 px / GiB/s) -->
  <g transform="translate(36, 152)">
    <text x="0" y="0" class="panel-title">Encode (16 KiB → 32 KiB hex)</text>
    <!-- better-hex: 61.2 -> 142.8px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="143" height="15" rx="3" fill="var(--better)"/>
    <text x="242" y="23" class="val">61.2 GiB/s</text>
    <!-- const-hex: 37.9 -> 88.4px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="88" height="15" rx="3" fill="var(--const)"/>
    <text x="187" y="44" class="val-muted">37.9 GiB/s</text>
    <!-- faster-hex: 29.7 -> 69.3px -->
    <text x="0" y="65" class="label">faster-hex</text>
    <rect x="92" y="54" width="69" height="15" rx="3" fill="var(--faster)"/>
    <text x="168" y="65" class="val-muted">29.7 GiB/s</text>
    <!-- base16ct: 5.8 -> 13.5px -->
    <text x="0" y="86" class="label">base16ct</text>
    <rect x="92" y="75" width="14" height="15" rx="3" fill="var(--base16ct)"/>
    <text x="113" y="86" class="val-muted">5.8 GiB/s</text>
    <!-- hex: 0.30 -> 3px min -->
    <text x="0" y="107" class="label">hex*</text>
    <rect x="92" y="96" width="3" height="15" rx="1.5" fill="var(--hex)"/>
    <text x="102" y="107" class="val-muted">0.30 GiB/s</text>
  </g>

  <line x1="36" y1="274" x2="466" y2="274" stroke="var(--grid)" stroke-width="1"/>

  <!-- x86 Decode -->
  <g transform="translate(36, 294)">
    <text x="0" y="0" class="panel-title">Decode (32 KiB hex → 16 KiB)</text>
    <!-- better-hex: 77.0 -> 179.7px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="180" height="15" rx="3" fill="var(--better)"/>
    <text x="279" y="23" class="val">77.0 GiB/s</text>
    <!-- const-hex: 40.7 -> 95.0px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="95" height="15" rx="3" fill="var(--const)"/>
    <text x="194" y="44" class="val-muted">40.7 GiB/s</text>
    <!-- faster-hex: 10.6 -> 24.7px -->
    <text x="0" y="65" class="label">faster-hex</text>
    <rect x="92" y="54" width="25" height="15" rx="3" fill="var(--faster)"/>
    <text x="124" y="65" class="val-muted">10.6 GiB/s</text>
    <!-- base16ct: 2.7 -> 6.3px -->
    <text x="0" y="86" class="label">base16ct</text>
    <rect x="92" y="75" width="6" height="15" rx="2" fill="var(--base16ct)"/>
    <text x="105" y="86" class="val-muted">2.7 GiB/s</text>
    <!-- hex: 0.24 -> 3px min -->
    <text x="0" y="107" class="label">hex*</text>
    <rect x="92" y="96" width="3" height="15" rx="1.5" fill="var(--hex)"/>
    <text x="102" y="107" class="val-muted">0.24 GiB/s</text>
  </g>

  <line x1="36" y1="416" x2="466" y2="416" stroke="var(--grid)" stroke-width="1"/>

  <!-- x86 Check -->
  <g transform="translate(36, 436)">
    <text x="0" y="0" class="panel-title">Check (32 KiB hex validation)</text>
    <!-- better-hex: 116.1 -> 270.9px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="271" height="15" rx="3" fill="var(--better)"/>
    <text x="370" y="23" class="val">116.1 GiB/s</text>
    <!-- const-hex: 60.0 -> 140.0px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="140" height="15" rx="3" fill="var(--const)"/>
    <text x="239" y="44" class="val-muted">60.0 GiB/s</text>
  </g>

  <!-- ==================== RIGHT COLUMN: AArch64 NEON ==================== -->
  <rect x="498" y="92" width="462" height="426" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="514" y="116" class="arch-title">AArch64 — Apple M5 Pro</text>
  <text x="514" y="132" class="arch-sub">NEON · rustc 1.100.0 · 30 samples</text>

  <!-- ARM64 Encode (scale: 45 GiB/s = 280 px => 6.222 px / GiB/s) -->
  <g transform="translate(514, 152)">
    <text x="0" y="0" class="panel-title">Encode (16 KiB → 32 KiB hex)</text>
    <!-- better-hex: 38.8 -> 241.4px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="241" height="15" rx="3" fill="var(--better)"/>
    <text x="340" y="23" class="val">38.8 GiB/s</text>
    <!-- const-hex: 39.0 -> 242.7px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="243" height="15" rx="3" fill="var(--const)"/>
    <text x="342" y="44" class="val-muted">39.0 GiB/s</text>
    <!-- base16ct: 14.0 -> 87.1px -->
    <text x="0" y="65" class="label">base16ct</text>
    <rect x="92" y="54" width="87" height="15" rx="3" fill="var(--base16ct)"/>
    <text x="186" y="65" class="val-muted">14.0 GiB/s</text>
    <!-- faster-hex: 3.0 -> 18.7px -->
    <text x="0" y="86" class="label">faster-hex</text>
    <rect x="92" y="75" width="19" height="15" rx="3" fill="var(--faster)"/>
    <text x="118" y="86" class="val-muted">3.0 GiB/s</text>
    <!-- hex: 0.81 -> 5.0px -->
    <text x="0" y="107" class="label">hex*</text>
    <rect x="92" y="96" width="5" height="15" rx="2" fill="var(--hex)"/>
    <text x="104" y="107" class="val-muted">0.81 GiB/s</text>
  </g>

  <line x1="514" y1="274" x2="944" y2="274" stroke="var(--grid)" stroke-width="1"/>

  <!-- ARM64 Decode -->
  <g transform="translate(514, 294)">
    <text x="0" y="0" class="panel-title">Decode (32 KiB hex → 16 KiB)</text>
    <!-- better-hex: 23.1 -> 143.7px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="144" height="15" rx="3" fill="var(--better)"/>
    <text x="243" y="23" class="val">23.1 GiB/s</text>
    <!-- const-hex: 22.1 -> 137.5px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="138" height="15" rx="3" fill="var(--const)"/>
    <text x="237" y="44" class="val-muted">22.1 GiB/s</text>
    <!-- base16ct: 4.5 -> 28.0px -->
    <text x="0" y="65" class="label">base16ct</text>
    <rect x="92" y="54" width="28" height="15" rx="3" fill="var(--base16ct)"/>
    <text x="127" y="65" class="val-muted">4.5 GiB/s</text>
    <!-- faster-hex: 2.4 -> 14.9px -->
    <text x="0" y="86" class="label">faster-hex</text>
    <rect x="92" y="75" width="15" height="15" rx="3" fill="var(--faster)"/>
    <text x="114" y="86" class="val-muted">2.4 GiB/s</text>
    <!-- hex: 0.43 -> 3px min -->
    <text x="0" y="107" class="label">hex*</text>
    <rect x="92" y="96" width="3" height="15" rx="1.5" fill="var(--hex)"/>
    <text x="102" y="107" class="val-muted">0.43 GiB/s</text>
  </g>

  <line x1="514" y1="416" x2="944" y2="416" stroke="var(--grid)" stroke-width="1"/>

  <!-- ARM64 Check -->
  <g transform="translate(514, 436)">
    <text x="0" y="0" class="panel-title">Check (32 KiB hex validation)</text>
    <!-- better-hex: 35.8 -> 222.8px -->
    <text x="0" y="23" class="label-bold">better-hex</text>
    <rect x="92" y="12" width="223" height="15" rx="3" fill="var(--better)"/>
    <text x="322" y="23" class="val">35.8 GiB/s</text>
    <!-- const-hex: 31.6 -> 196.6px -->
    <text x="0" y="44" class="label">const-hex</text>
    <rect x="92" y="33" width="197" height="15" rx="3" fill="var(--const)"/>
    <text x="296" y="44" class="val-muted">31.6 GiB/s</text>
  </g>

  <!-- Footer -->
  <text x="24" y="538" class="foot">* hex measured via hex::encode / hex::decode (allocating, per benches/compare.rs). Each column is scaled independently (x86_64 max 120 GiB/s; AArch64 max 45 GiB/s).</text>
  <text x="24" y="554" class="foot">Reproduce: cargo bench --bench compare --features _bench_base16ct,_bench_const_hex,_bench_faster_hex,_bench_hex</text>
</svg>
