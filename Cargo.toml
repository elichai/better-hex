[package]
name = "better-hex"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast hex encoding/decoding with SIMD, const fn, and constant-time support"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
force-generic = []
_bench_internals = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cfg-if = "1"

[target.'cfg(all(not(feature = "std"), any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
cpufeatures = "0.3"

[dev-dependencies]
bytemuck = "1"
criterion = { version = "0.5", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "check"
harness = false
