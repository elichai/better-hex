[package]
name = "better-hex"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast hex encoding/decoding with SIMD, const fn, and constant-time support"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
disable-simd = []
serde = ["dep:serde"]
heapless = ["dep:heapless"]
arrayvec = ["dep:arrayvec"]
_bench_internals = []
_bench_const_hex = ["dep:const-hex"]
_bench_faster_hex = ["dep:faster-hex"]
_bench_hex = ["dep:hex"]

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
cfg-if = "1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
heapless = { version = "0.9", default-features = false, optional = true }
arrayvec = { version = "0.7", default-features = false, optional = true }
const-hex = { version = "1", optional = true, features = ["serde"] }
faster-hex = { version = "0.10", optional = true, default-features = false, features = ["alloc"] }
hex = { version = "0.4", optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3"

[dev-dependencies]
bytemuck = "1"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rand_core = "0.10"
rand_xoshiro = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "check"
harness = false

[[bench]]
name = "display"
harness = false

[[bench]]
name = "traits"
harness = false

[[bench]]
name = "compare"
harness = false
