[package]
name = "better-hex"
version = "1.0.0"
edition = "2024"
autobenches = false
license = "MIT OR Apache-2.0"
description = "Fast hex encoding/decoding with SIMD, const fn, and constant-time support"
repository = "https://github.com/elichai/better-hex"
keywords = ["hex", "encoding", "simd", "no-std", "constant-time"]
categories = ["encoding", "no-std"]

# docs.rs builds nightly + --all-features and sets `--cfg docsrs` so the
# `#[cfg_attr(docsrs, doc(cfg(...)))]` annotations on feature-gated items
# render "Available on crate feature `…` only" badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
disable-simd = []
serde = ["dep:serde"]
heapless = ["dep:heapless"]
arrayvec = ["dep:arrayvec"]
_bench_internals = ["std"]
_bench_base16ct = []
_bench_const_hex = []
_bench_faster_hex = []
_bench_hex = []
ct-test = ["dep:crabgrind", "_bench_internals"]

[dependencies]
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics", "must_cast"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
heapless = { version = "0.9", default-features = false, optional = true }
arrayvec = { version = "0.7", default-features = false, optional = true }
crabgrind = { version = "0.2", optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3"

[dev-dependencies]
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rand_core = "0.10"
rand_xoshiro = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1"
base16ct = "1"
const-hex = { version = "1", features = ["serde"] }
faster-hex = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[[bench]]
name = "encode"
harness = false
required-features = ["_bench_internals"]

[[bench]]
name = "decode"
harness = false
required-features = ["_bench_internals"]

[[bench]]
name = "check"
harness = false
required-features = ["_bench_internals"]

[[bench]]
name = "display"
harness = false
required-features = ["alloc"]

[[bench]]
name = "traits"
harness = false
required-features = ["alloc"]

[[bench]]
name = "compare"
harness = false
required-features = ["alloc"]
