# Constant-time verification via Valgrind memcheck.
#
# Marks input data as "uninitialized", then runs encode/decode/check.
# Any data-dependent branch or memory access triggers a Valgrind error.
#
# Covers x86 scalar/SSSE3/AVX2/AVX-512 (Intel runner) and aarch64 NEON
# (GitHub-hosted ARM runner). WASM is not tested here.
name: CT Verification (Valgrind)

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ct-valgrind:
    name: Constant-time verification (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Install Valgrind and libclang
        run: sudo apt-get update && sudo apt-get install -y valgrind libclang-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run CT tests under Valgrind (release, for accurate codegen)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: >-
            valgrind --tool=memcheck --error-exitcode=1 --leak-check=no --errors-for-leak-kinds=none
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: >-
            valgrind --tool=memcheck --error-exitcode=1 --leak-check=no --errors-for-leak-kinds=none
        run: cargo test --locked --features ct-test --test ct_valgrind --release
