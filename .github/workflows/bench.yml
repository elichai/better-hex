# NOTE: Third-party actions are referenced by tag rather than immutable SHA.
# For a security-sensitive crate, consider pinning to full commit SHAs and
# using Dependabot or Renovate to keep them up to date.
name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # PR benchmarks: read-only, no publishing. Ensures benchmarks compile
  # and runs them, but does not store results or comment.
  benchmark-pr:
    name: Performance check (PR, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Run benchmarks
        # Reduced criterion sample-size / measurement-time vs defaults
        # (100 samples, 5 s measurement, 3 s warmup -> ~8 s per bench).
        # 10 samples / 2 s / 1 s drops each bench to ~3 s; noise stays
        # within the 115% alert threshold used downstream.
        run: |
          cargo bench --locked --features _bench_internals,serde \
            --bench encode --bench decode --bench check \
            --bench display --bench traits \
            -- --output-format bencher \
            --warm-up-time 1 --measurement-time 2 --sample-size 10 --noplot \
            | tee bench_output.txt

  # Push benchmarks: write permissions for storing results and commenting.
  # Only runs on trusted code (merged to main).
  #
  # x86_64 history lives at `dev/bench/` (legacy path, dashboard URL
  # already linked from the gh-pages root redirect). aarch64 history
  # lives at `dev/bench/aarch64/`. Each arch has its own `data.js` and
  # `index.html`, so the regression-alert threshold compares like-for-like.
  benchmark-push:
    name: Performance check (push, ${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      # Serialize the gh-pages writes — both jobs push to the same branch,
      # so running them in parallel races on `git push` to `gh-pages`.
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            bench_dir: dev/bench
            bench_name: better-hex Benchmarks (x86_64)
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            bench_dir: dev/bench/aarch64
            bench_name: better-hex Benchmarks (aarch64)
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true

      - name: Run benchmarks
        # Reduced criterion sample-size / measurement-time vs defaults
        # (100 samples, 5 s measurement, 3 s warmup -> ~8 s per bench).
        # 10 samples / 2 s / 1 s drops each bench to ~3 s; noise stays
        # within the 115% alert threshold used downstream.
        run: |
          cargo bench --locked --features _bench_internals,serde \
            --bench encode --bench decode --bench check \
            --bench display --bench traits \
            -- --output-format bencher \
            --warm-up-time 1 --measurement-time 2 --sample-size 10 --noplot \
            | tee bench_output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ matrix.bench_name }}
          tool: cargo
          output-file-path: bench_output.txt
          auto-push: true
          comment-on-alert: true
          alert-threshold: '115%'
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: ${{ matrix.bench_dir }}
