# NOTE: Third-party actions are referenced by tag rather than immutable SHA.
# For a security-sensitive crate, consider pinning to full commit SHAs and
# using Dependabot or Renovate to keep them up to date.
name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # PR benchmarks: read-only, no publishing. Ensures benchmarks compile
  # and runs them, but does not store results or comment.
  benchmark-pr:
    name: Performance check (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Run benchmarks
        run: |
          cargo bench --locked --features _bench_internals,serde \
            --bench encode --bench decode --bench check \
            --bench display --bench traits \
            -- --output-format bencher \
            | tee bench_output.txt

  # Push benchmarks: write permissions for storing results and commenting.
  # Only runs on trusted code (merged to main).
  benchmark-push:
    name: Performance check (push)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true

      - name: Run benchmarks
        run: |
          cargo bench --locked --features _bench_internals,serde \
            --bench encode --bench decode --bench check \
            --bench display --bench traits \
            -- --output-format bencher \
            | tee bench_output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: better-hex Benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          auto-push: true
          comment-on-alert: true
          alert-threshold: '115%'
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench
