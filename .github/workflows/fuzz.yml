# NOTE: Third-party actions are referenced by tag rather than immutable SHA.
# For a security-sensitive crate, consider pinning to full commit SHAs and
# using Dependabot or Renovate to keep them up to date.
name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run nightly at 03:00 UTC for longer fuzzing sessions
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }} on ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [oracle, api, hex_str]
        platform:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Determine fuzz duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      # Build flags and timeouts live in fuzz/fuzz.sh — one source of truth
      # so local runs (./fuzz/fuzz.sh) and CI invoke the fuzzer identically.
      - name: Run fuzzer
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: ./fuzz/fuzz.sh "$FUZZ_TARGET"
