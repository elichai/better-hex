name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run nightly at 03:00 UTC for longer fuzzing sessions
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - oracle
          - encode_oracle
          - decode_oracle
          - roundtrip
          - lengths
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Determine fuzz duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fuzzer
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: cargo fuzz run "$FUZZ_TARGET" -- -max_total_time="$FUZZ_SECONDS"
