# NOTE: Third-party actions are referenced by tag rather than immutable SHA.
# For a security-sensitive crate, consider pinning to full commit SHAs and
# using Dependabot or Renovate to keep them up to date.
name: Miri

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full API coverage under the scalar path (all features enabled).
          - name: Miri (x86_64 scalar API)
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            cargo_args: --target x86_64-unknown-linux-gnu --features disable-simd,serde,heapless,arrayvec --lib --tests

          # Direct backend coverage on x86_64 with the relevant virtual CPU
          # features. All crate features enabled for maximum code coverage.
          - name: Miri (x86_64 SSSE3 impl)
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+ssse3
            cargo_args: --target x86_64-unknown-linux-gnu --features serde,heapless,arrayvec --lib --tests

          - name: Miri (x86_64 AVX2 impl)
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx2
            cargo_args: --target x86_64-unknown-linux-gnu --features serde,heapless,arrayvec --lib --tests

          # AVX-512BW exercises `decode_avx512` and `check_avx512`; the encode
          # path falls back to AVX2 at this tier (VBMI is required for the
          # `vpermi2b` interleave).
          - name: Miri (x86_64 AVX-512BW impl)
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx512bw
            cargo_args: --target x86_64-unknown-linux-gnu --features serde,heapless,arrayvec --lib --tests

          # AVX-512 VBMI additionally exercises `encode_avx512`, which uses
          # `_mm512_permutex2var_epi8` (vpermi2b). Miri added support for this
          # intrinsic in nightly-2026-05-16; older nightlies abort here.
          - name: Miri (x86_64 AVX-512 VBMI impl)
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx512vbmi
            cargo_args: --target x86_64-unknown-linux-gnu --features serde,heapless,arrayvec --lib --tests

          # Cover the 32-bit x86 backend as a distinct target.
          - name: Miri (i686 SSSE3 impl)
            target: i686-unknown-linux-gnu
            rustflags: -C target-feature=+ssse3
            cargo_args: --target i686-unknown-linux-gnu --features serde,heapless,arrayvec --lib

          # Cross-interpret the AArch64 NEON backend on the same Linux runner.
          # wasm stays out of Miri because Miri only promises Linux/macOS/Windows
          # targets; the normal CI workflow already executes the wasm backend.
          - name: Miri (aarch64 NEON impl)
            target: aarch64-unknown-linux-gnu
            rustflags: -C target-feature=+neon
            cargo_args: --target aarch64-unknown-linux-gnu --features serde,heapless,arrayvec --lib --tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
          targets: ${{ matrix.target }}

      # criterion (a dev-dep) pulls `alloca`, which has a C build script.
      # The cross-compiled i686 and aarch64 matrix entries need the
      # corresponding host gcc toolchains to produce target objects.
      - name: Install i686 cross toolchain
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Miri
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo miri setup --target ${{ matrix.target }}

      - name: Run tests under Miri
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # cc-rs uses these to find the cross linker / compiler for the
          # alloca C build script when targeting aarch64.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          MIRIFLAGS: >-
            -Zmiri-env-set=PROPTEST_CASES=8
            -Zmiri-env-set=PROPTEST_MAX_SHRINK_ITERS=32
            -Zmiri-env-set=PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
        run: cargo miri test --locked ${{ matrix.cargo_args }}

      - name: Run doc-tests under Miri
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # rustdoc compiles each doctest with RUSTDOCFLAGS, not RUSTFLAGS,
          # so the target-feature toggles must be plumbed through both for
          # the SIMD-enabled matrix entries to actually run their SSSE3 /
          # AVX2 / AVX-512BW / AVX-512 VBMI / NEON paths under Miri.
          RUSTDOCFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          MIRIFLAGS: >-
            -Zmiri-env-set=PROPTEST_CASES=8
            -Zmiri-env-set=PROPTEST_MAX_SHRINK_ITERS=32
            -Zmiri-env-set=PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
        run: cargo miri test --locked --target ${{ matrix.target }} --features serde,heapless,arrayvec --doc

  # Replay the persisted fuzz corpus through each `fuzz_target!` body under
  # Miri. Each fuzz bin keeps `#![cfg_attr(not(miri), no_main)]` and adds a
  # `#[cfg(miri)] fn main` that iterates `$MIRI_CORPUS_DIR` and feeds every
  # file to the macro-generated `rust_fuzzer_test_input` symbol. This is
  # additive coverage over the proptest matrix above: real corpus seeds
  # (regressions, libFuzzer-discovered edges) exercised under Miri's UB
  # checker. -Zmiri-disable-isolation is required for `std::fs` access.
  miri-fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # AVX-512 VBMI activates the highest x86 tier at compile time
          # (dispatched -> `encode_avx512`) and Miri's CPUID shim reports
          # ssse3/avx2/avx512* as available, so every per-tier branch in
          # `oracle.rs` fires.
          - name: Miri fuzz corpus (x86_64 AVX-512 VBMI)
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx512vbmi
          - name: Miri fuzz corpus (aarch64 NEON)
            target: aarch64-unknown-linux-gnu
            rustflags: -C target-feature=+neon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The corpus lives on the `fuzz-corpus` orphan branch (no shared history
      # with main). Same checkout pattern as fuzz.yml; `path:` keeps it out of
      # the main worktree.
      - name: Checkout fuzz-corpus
        uses: actions/checkout@v4
        with:
          ref: fuzz-corpus
          path: fuzz-corpus
          fetch-depth: 1

      - name: Stage seed corpus
        run: |
          set -euo pipefail
          for t in oracle api hex_str; do
            mkdir -p "fuzz/corpus/$t"
            # libFuzzer filenames are sha1(content), so cp -n is a free dedup.
            cp -n "fuzz-corpus/$t/"* "fuzz/corpus/$t/" 2>/dev/null || true
            echo "seeded $t with $(ls "fuzz/corpus/$t" | wc -l) inputs"
          done

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
          targets: ${{ matrix.target }}

      # libfuzzer-sys's `link_libfuzzer` default feature unconditionally
      # builds its C++ sources via build.rs (even under `cargo miri`, which
      # never actually links them), so the cross g++ is required in addition
      # to the gcc the upper `miri` job uses. The build artifact is harmless
      # — miri interprets the Rust side and ignores the C++ static lib.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          workspaces: fuzz -> fuzz/target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Miri
        working-directory: fuzz
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        # fuzz/rust-toolchain.toml pins a nightly that may lag behind the one
        # we just installed; `+nightly` forces the latest with miri component.
        run: cargo +nightly miri setup --target ${{ matrix.target }}

      - name: Replay fuzz corpus under Miri
        working-directory: fuzz
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          MIRI_TARGET: ${{ matrix.target }}
          # -Zmiri-disable-isolation lets `std::fs::read_dir` / `read` reach
          # the host filesystem so the corpus driver can iterate input files.
          # MIRI_CORPUS_DIR overrides the default `corpus/<target>` path so
          # the bin always uses an absolute, hermetic location.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-env-forward=MIRI_CORPUS_DIR
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          for target in oracle api hex_str; do
            echo "::group::Replaying $target corpus under Miri"
            MIRI_CORPUS_DIR="$PWD/corpus/$target" \
              cargo +nightly miri run --locked --bin "$target" --target "$MIRI_TARGET"
            echo "::endgroup::"
          done
