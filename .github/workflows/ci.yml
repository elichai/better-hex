# NOTE: Third-party actions (actions/checkout, dtolnay/rust-toolchain,
# Swatinem/rust-cache, etc.) are referenced by tag rather than immutable SHA.
# For a security-sensitive crate, consider pinning to full commit SHAs and
# using Dependabot or Renovate to keep them up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Public API coverage on the default x86_64 runtime dispatch path.
          - name: Test (x86_64 dispatch API)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_command: test
            cargo_args: --locked --target x86_64-unknown-linux-gnu

          # Force the scalar / ct_scalar backends.
          - name: Test (scalar disable-simd API)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_command: test
            cargo_args: --locked --target x86_64-unknown-linux-gnu --features disable-simd

          # Direct unit tests for SSSE3-specific x86 implementations.
          - name: Test (x86_64 SSSE3 impl)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+ssse3
            cargo_command: test
            cargo_args: --locked --lib --target x86_64-unknown-linux-gnu

          # Direct unit tests for AVX2-specific x86 implementations.
          - name: Test (x86_64 AVX2 impl)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx2
            cargo_command: test
            cargo_args: --locked --lib --target x86_64-unknown-linux-gnu

          # Run AVX-512BW tests best-effort: GitHub-hosted runners typically
          # have Xeon CPUs with AVX-512, but this is not guaranteed, so
          # allow_failure lets CI stay green if the runner lacks support.
          - name: Test (x86_64 AVX-512BW impl, best-effort)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-feature=+avx512bw
            cargo_command: test
            cargo_args: --locked --lib --target x86_64-unknown-linux-gnu
            allow_failure: true

          # Pin macOS 14 to keep this on GitHub's arm64 runner class for NEON.
          - name: Test (aarch64 NEON API)
            os: macos-14
            target: aarch64-apple-darwin
            cargo_command: test
            cargo_args: --locked --target aarch64-apple-darwin

          - name: Test (aarch64 NEON impl)
            os: macos-14
            target: aarch64-apple-darwin
            rustflags: -C target-feature=+neon
            cargo_command: test
            cargo_args: --locked --lib --target aarch64-apple-darwin

          - name: Test (x86_64 optional features)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_command: test
            cargo_args: --locked --target x86_64-unknown-linux-gnu --features serde,heapless,arrayvec

          - name: Test (aarch64 optional features)
            os: macos-14
            target: aarch64-apple-darwin
            cargo_command: test
            cargo_args: --locked --target aarch64-apple-darwin --features serde,heapless,arrayvec

          # The no-alloc configuration cannot run the integration test suite
          # because many tests intentionally use alloc-only APIs. Keep this as
          # a build check for the library surface instead of a broken test job.
          - name: Check (no_std no_alloc)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_command: check
            cargo_args: --locked --lib --target x86_64-unknown-linux-gnu --no-default-features

          - name: Test (no_std + alloc)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_command: test
            cargo_args: --locked --target x86_64-unknown-linux-gnu --no-default-features --features alloc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo ${{ matrix.cargo_command }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: cargo ${{ matrix.cargo_command }} ${{ matrix.cargo_args }}

  test-wasm:
    name: Test (wasm SIMD128)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        env:
          RUSTFLAGS: -C target-feature=+simd128
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: cargo test (WASM + simd128)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo test --locked --target wasm32-wasip1 --no-default-features --features alloc,serde,heapless,arrayvec

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --features serde,heapless,arrayvec -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt -- --check

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --locked --features serde,heapless,arrayvec --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
